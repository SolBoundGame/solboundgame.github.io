    <style>
      /* Loading screen: inline so it paints before any JS/CSS bundle arrives */
      html, body { margin: 0; background: #0c0f16; }
      #loader {
        --ember: oklch(0.72 0.17 50);
        --progress: 0%;
        position: fixed; inset: 0; z-index: 100;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 2.2rem;
        background: radial-gradient(ellipse at center, #141925 0%, #07090e 100%);
        color: #efebe4;
        font-family: "Cinzel", "Times New Roman", serif;
        transition: opacity 1000ms cubic-bezier(0.4, 0, 0.2, 1) 250ms;
      }
      /* Hand-off, step 1: loader contents drift up and dissolve */
      #loader > * { transition: opacity 450ms ease, transform 600ms cubic-bezier(0.4, 0, 0.2, 1), filter 450ms ease; }
      #loader.is-done > * { opacity: 0; transform: translateY(-10px); filter: blur(4px); }
      /* The eclipse swells into the scene instead of just vanishing */
      #loader.is-done .ld-eclipse { transform: scale(2.4); filter: blur(10px); transition-duration: 700ms; }
      /* Step 2: the backdrop dissolves into the planet */
      #loader.is-done { opacity: 0; pointer-events: none; }
      #loader .ld-eclipse {
        position: relative; width: 88px; height: 88px; border-radius: 50%;
        background: #07090e;
        box-shadow:
          0 0 0 2px #ff9a3c,
          0 0 14px 4px rgba(255, 140, 50, 0.75),
          0 0 46px 12px rgba(255, 110, 30, 0.35);
        animation: ld-pulse 2.4s ease-in-out infinite;
      }
      #loader .ld-eclipse::after {
        /* thin bright arc that orbits the rim */
        content: ""; position: absolute; inset: -4px; border-radius: 50%;
        border: 2px solid transparent; border-top-color: #ffe2a8;
        filter: blur(0.6px);
        animation: ld-spin 1.6s linear infinite;
      }
      #loader .ld-title {
        margin: 0; font-weight: 400; font-size: 1.5rem;
        letter-spacing: 0.4em; margin-right: -0.4em;
      }
      #loader .ld-title span { color: #ffb347; }
      #loader .ld-status { display: flex; flex-direction: column; align-items: center; gap: 0.8rem; }
      #loader .ld-bar {
        position: relative; width: min(240px, 60vw); height: 2px; overflow: hidden;
        background: rgba(255, 255, 255, 0.1);
      }
      #loader .ld-bar::before {
        content: ""; position: absolute; top: 0; bottom: 0; left: 0;
        width: 35%; background: var(--ember);
        box-shadow: 0 0 10px var(--ember);
        animation: ld-indeterminate 1.4s ease-in-out infinite;
      }
      #loader.is-determinate .ld-bar::before {
        width: var(--progress); animation: none; transition: width 300ms ease;
      }
      #loader .ld-label {
        margin: 0; font-size: 0.68rem; letter-spacing: 0.4em; margin-right: -0.4em;
        color: #9aa0ad; text-transform: uppercase;
      }
      #loader .ld-pct { color: var(--ember); margin-left: 0.6em; }
      #loader .ld-slow {
        position: absolute; bottom: 8vh; left: 50%; transform: translateX(-50%);
        width: 90vw; margin: 0; text-align: center;
        font-family: "Spectral", Georgia, serif; font-style: italic; font-size: 0.95rem;
        color: #7d8391; opacity: 0;
        animation: ld-fade-in 800ms ease 9s forwards; /* only appears if loading drags on */
      }
      @keyframes ld-spin { to { transform: rotate(360deg); } }
      @keyframes ld-pulse { 50% { box-shadow: 0 0 0 2px #ffb347, 0 0 18px 6px rgba(255, 150, 60, 0.85), 0 0 60px 18px rgba(255, 110, 30, 0.4); } }
      @keyframes ld-indeterminate { 0% { left: -35%; } 100% { left: 100%; } }
      @keyframes ld-fade-in { to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        #loader.is-done > *, #loader.is-done .ld-eclipse { transform: none; filter: none; }
        #loader .ld-eclipse, #loader .ld-eclipse::after { animation: none; }
        #loader .ld-bar::before { animation: none; left: 0; width: 100%; opacity: 0.5; }
      }
    </style>

  <body>
    <div id="loader" role="status" aria-live="polite" aria-busy="true" aria-label="Loading SolBound">
      <div class="ld-eclipse" aria-hidden="true"></div>
      <p class="ld-title" aria-hidden="true"><span>SOL</span>BOUND</p>
      <div class="ld-status">
        <div class="ld-bar" aria-hidden="true"></div>
        <p class="ld-label">Loading<span class="ld-pct" data-loader-pct></span></p>
      </div>
      <p class="ld-slow">Slow connection? Hang tight. The planet is on its way.</p>
    </div>
    <noscript>
      <style>#loader { display: none; }</style>
      <p style="color:#efebe4;text-align:center;padding:2rem;font-family:serif">SolBound needs JavaScript to show the 3D planet.</p>
    </noscript>
    <div id="root"></div>
  </body>
